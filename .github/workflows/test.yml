name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up the game protocol client
        run: e2e/client/setup.sh python

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          PN_SMM_TEST_POSTGRES_URI: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          PN_SMM_E2E_PYTHON: ${{ github.workspace }}/e2e/client/.venv/bin/python
        run: go test ./... -p 1 -count=1
